services:
  todo-app:
    image: todo-app
    build: .
    container_name: todo-container
    ports:
      - "8000:8000"
    volumes:
      - sqlite-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/todos')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  sqlite-data:
